name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Manifests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install ruff
          pip install -e ".[all]"
          pip install pytest

      - name: Run tests
        run: |
          pytest tests/ -q --tb=short

      - name: Lint product and tests (ruff)
        run: ruff check codedna_tool tests

      - name: Validate CodeDNA Manifests
        run: python tools/validate_manifests.py codedna_tool

      - name: Dogfood CodeDNA coverage
        run: codedna check codedna_tool

      - name: Verify structural annotations are current
        run: codedna verify codedna_tool --extensions py

      - name: Check integrations exist
        run: |
          echo "Checking integration files..."
          test -f integrations/CLAUDE.md && echo "✓ CLAUDE.md" || (echo "✗ CLAUDE.md missing" && exit 1)
          test -f integrations/.cursorrules && echo "✓ .cursorrules" || (echo "✗ .cursorrules missing" && exit 1)
          test -f integrations/copilot-instructions.md && echo "✓ copilot-instructions.md" || (echo "✗ copilot-instructions.md missing" && exit 1)
          echo "✓ All integration files present"

      - name: Check SPEC.md exists
        run: |
          test -f SPEC.md && echo "✓ SPEC.md present" || (echo "✗ SPEC.md missing" && exit 1)

      - name: Syntax check tools
        run: |
          for f in tools/*.py codedna_tool/*.py; do
            python -c "import ast; ast.parse(open('$f').read())" && echo "✓ $f" || exit 1
          done

  windows-core:
    name: Windows core portability
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_manifest_store.py tests/test_language_adapters.py -q
